name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Prepare Standalone Package
        run: |
          mkdir package

          cp -R .next/standalone/* package/

          rm -rf package/.next
          mkdir -p package/.next

          cp -R .next/standalone/.next/* package/.next/

          cp -R .next/static package/.next/

          if [ -d public ]; then
            cp -R public package/
          fi

          tar -czf deploy.tar.gz -C package .

      - name: Upload Package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "deploy.tar.gz"
          target: "/home/tmncoid"

      - name: Extract Package
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            APP=/home/tmncoid/public_html/myapp

            mkdir -p $APP

            cd $APP

            cp -f /home/tmncoid/deploy.tar.gz .

            tar -xzf deploy.tar.gz

            rm deploy.tar.gz

            mkdir -p tmp
            touch tmp/restart.txt

            echo "Deploy finished."
